<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Town Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #667eea;
            font-size: 2em;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.stop {
            background: #ef4444;
        }

        button.stop:hover {
            background: #dc2626;
        }

        button.reset {
            background: #f59e0b;
        }

        button.reset:hover {
            background: #d97706;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .location-grid {
            display: grid;
            gap: 15px;
        }

        .location-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .location-card:hover {
            transform: translateX(5px);
        }

        .location-name {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .location-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .location-capacity {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 10px;
        }

        .agent-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .agent-badge {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .agent-card {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #10b981;
        }

        .agent-card.villain {
            border-left-color: #ef4444;
        }

        .agent-card.doctor {
            border-left-color: #3b82f6;
        }

        .agent-card.dead {
            background: #1f2937;
            color: #9ca3af;
            opacity: 0.7;
        }

        .agent-name {
            font-weight: bold;
            color: #10b981;
            margin-bottom: 5px;
        }

        .agent-details {
            font-size: 0.85em;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .activity-feed {
            max-height: 400px;
            overflow-y: auto;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
        }

        .activity-item {
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .activity-time {
            color: #667eea;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .activity-feed {
            max-height: 600px;
            overflow-y: auto;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
        }

        .activity-item {
            padding: 12px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            border-left: 3px solid #667eea;
        }

        .activity-item.movement {
            border-left-color: #f59e0b;
        }

        .activity-item.conversation {
            border-left-color: #10b981;
        }

        .activity-item.attack {
            border-left-color: #ef4444;
            background: #fee;
        }

        .activity-item.resurrection {
            border-left-color: #3b82f6;
            background: #eff6ff;
        }

        .activity-time {
            color: #667eea;
            font-weight: bold;
            font-size: 0.85em;
        }

        .conversation-exchange {
            margin: 8px 0;
            padding-left: 10px;
            border-left: 2px solid #e5e7eb;
        }

        .speaker-name {
            font-weight: bold;
            color: #10b981;
        }

        .movement-text {
            color: #666;
        }

        .movement-icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🏘️ Agent Town Dashboard</h1>
                <div class="status">
                    <div class="status-indicator"></div>
                    <span id="time-display">09:00</span>
                    <span>•</span>
                    <span id="step-display">Step 0</span>
                </div>
            </div>
            <div class="controls">
                <button id="start-btn" onclick="startSimulation()">▶️ Start</button>
                <button class="stop" id="stop-btn" onclick="stopSimulation()">⏸️ Stop</button>
                <button class="reset" id="reset-btn" onclick="resetSimulation()">🔄 Reset</button>
            </div>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="agent-count">0</div>
                <div class="stat-label">Agents</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="location-count">0</div>
                <div class="stat-label">Locations</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="total-memories">0</div>
                <div class="stat-label">Total Memories</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="panel">
                <h2>📍 Locations</h2>
                <div class="location-grid" id="locations"></div>
            </div>

            <div class="panel">
                <h2>👥 Agents</h2>
                <div id="agents"></div>
            </div>

            <div class="panel">
                <h2>💬 Live Activity Feed</h2>
                <div class="activity-feed" id="activity-feed">
                    <div class="empty-state">No activity yet. Click Start to begin!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentState = null;

        socket.on('connect', () => {
            console.log('Connected to server');
            fetchStatus();
        });

        socket.on('simulation_update', (data) => {
            currentState = data;
            updateDashboard(data);
        });

        function fetchStatus() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    currentState = data;
                    updateDashboard(data);
                })
                .catch(err => console.error('Error fetching status:', err));
        }

        function updateDashboard(data) {
            if (!data) return;

            // Update header stats
            document.getElementById('time-display').textContent = data.current_time;
            document.getElementById('step-display').textContent = `Step ${data.step_count}`;

            // Update stats
            document.getElementById('agent-count').textContent = data.agents.length;
            document.getElementById('location-count').textContent = Object.keys(data.locations).length;

            const totalMemories = data.agents.reduce((sum, agent) => sum + agent.memory_count, 0);
            document.getElementById('total-memories').textContent = totalMemories;

            // Update locations
            const locationsHtml = Object.values(data.locations).map(loc => `
                <div class="location-card">
                    <div class="location-name">${loc.name}</div>
                    <div class="location-description">${loc.description}</div>
                    <div class="location-capacity">Capacity: ${loc.count}/${loc.capacity}</div>
                    <div class="agent-list">
                        ${loc.agents.length > 0
                            ? loc.agents.map(agent => `<span class="agent-badge">${agent}</span>`).join('')
                            : '<span class="empty-state">Empty</span>'
                        }
                    </div>
                </div>
            `).join('');
            document.getElementById('locations').innerHTML = locationsHtml;

            // Update agents
            const roleEmojis = {
                'artist': '🎨',
                'scholar': '📚',
                'explorer': '🧭',
                'socialite': '🎭',
                'resident': '🏠',
                'villain': '😈',
                'doctor': '⚕️'
            };

            const agentsHtml = data.agents.map(agent => {
                const cardClass = agent.status === 'dead' ? 'agent-card dead' : `agent-card ${agent.role}`;
                const statusEmoji = agent.status === 'dead' ? '💀 DEAD' : '✅ Alive';
                const angerBar = agent.role === 'villain' ?
                    `<div>😡 Anger: <div style="background:#ef4444;width:${agent.anger_level*100}%;height:8px;border-radius:4px;"></div></div>` : '';

                return `
                    <div class="${cardClass}">
                        <div class="agent-name">${roleEmojis[agent.role] || '👤'} ${agent.name}</div>
                        <div class="agent-details">
                            <div><strong>Role:</strong> ${agent.role.charAt(0).toUpperCase() + agent.role.slice(1)}</div>
                            <div><strong>Status:</strong> ${statusEmoji}</div>
                            <div>📍 ${agent.location}</div>
                            <div>✨ ${agent.personality}</div>
                            <div>💬 ${agent.style}</div>
                            <div>🧠 ${agent.memory_count} memories</div>
                            ${angerBar}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('agents').innerHTML = agentsHtml;

            // Update activity feed
            const activityFeed = document.getElementById('activity-feed');
            if (data.recent_events && data.recent_events.length > 0) {
                const eventsHtml = data.recent_events.slice().reverse().map(event => {
                    if (event.type === 'conversation') {
                        const exchanges = event.exchanges.map(ex =>
                            `<div class="conversation-exchange">
                                <span class="speaker-name">${ex.speaker}:</span> "${ex.message}"
                            </div>`
                        ).join('');
                        return `
                            <div class="activity-item conversation">
                                <div class="activity-time">${event.time}</div>
                                <div><strong>💬 Conversation at ${event.location}</strong></div>
                                <div style="font-size: 0.85em; color: #666;">Between ${event.participants.join(' and ')}</div>
                                ${exchanges}
                            </div>
                        `;
                    } else if (event.type === 'movement') {
                        return `
                            <div class="activity-item movement">
                                <div class="activity-time">${event.time}</div>
                                <div class="movement-text">
                                    <span class="movement-icon">🚶</span>
                                    <strong>${event.agent}</strong> moved from <strong>${event.from}</strong> to <strong>${event.to}</strong>
                                </div>
                            </div>
                        `;
                    } else if (event.type === 'attack') {
                        return `
                            <div class="activity-item attack">
                                <div class="activity-time">${event.time}</div>
                                <div style="color: #ef4444; font-weight: bold;">
                                    ⚠️ ATTACK at ${event.location}
                                </div>
                                <div style="font-size: 0.9em;">
                                    <strong style="color: #7f1d1d;">${event.attacker}</strong> attacked
                                    <strong style="color: #7f1d1d;">${event.victim}</strong>
                                </div>
                                <div style="font-size: 0.85em; color: #991b1b; margin-top: 5px;">
                                    💀 ${event.victim} is dead!
                                </div>
                            </div>
                        `;
                    } else if (event.type === 'resurrection') {
                        return `
                            <div class="activity-item resurrection">
                                <div class="activity-time">${event.time}</div>
                                <div style="color: #3b82f6; font-weight: bold;">
                                    ✨ RESURRECTION at ${event.location}
                                </div>
                                <div style="font-size: 0.9em;">
                                    <strong style="color: #1e40af;">${event.doctor}</strong> resurrected
                                    <strong style="color: #1e40af;">${event.patient}</strong>
                                </div>
                                <div style="font-size: 0.85em; color: #1e3a8a; margin-top: 5px;">
                                    ✅ ${event.patient} is alive again!
                                </div>
                            </div>
                        `;
                    }
                    return '';
                }).join('');
                activityFeed.innerHTML = eventsHtml;

                // Auto-scroll to bottom if user is near bottom
                if (activityFeed.scrollHeight - activityFeed.scrollTop < activityFeed.clientHeight + 100) {
                    activityFeed.scrollTop = activityFeed.scrollHeight;
                }
            } else {
                activityFeed.innerHTML = '<div class="empty-state">No activity yet. Click Start to begin!</div>';
            }
        }

        function startSimulation() {
            fetch('/api/start', { method: 'POST' })
                .then(res => res.json())
                .then(data => console.log('Simulation started:', data))
                .catch(err => console.error('Error starting simulation:', err));
        }

        function stopSimulation() {
            fetch('/api/stop', { method: 'POST' })
                .then(res => res.json())
                .then(data => console.log('Simulation stopped:', data))
                .catch(err => console.error('Error stopping simulation:', err));
        }

        function resetSimulation() {
            fetch('/api/reset', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    console.log('Simulation reset:', data);
                    fetchStatus();
                })
                .catch(err => console.error('Error resetting simulation:', err));
        }

        // Initial load
        fetchStatus();
    </script>
</body>
</html>
